<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLY HEAVEN 4D</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div class="hud">
      <div class="eyebrow">FLY HEAVEN // 4D EXPERIMENT</div>
      <div class="title">Tesseract Habitat</div>
      <div class="route">R⁴ → perspective projection → R³ → screen</div>
      <div class="status"><span></span> 4D rotation active</div>
    </div>

    <div class="w-legend">
      <div class="w-title">FOURTH COORDINATE W</div>
      <div class="w-bar"></div>
      <div class="w-labels">
        <span>−W · cyan</span>
        <span>W ≈ 0</span>
        <span>+W · magenta</span>
      </div>
    </div>

    <div class="legend">
      <div><b>drag</b> rotate 3D camera</div>
      <div><b>scroll</b> zoom</div>
      <div><b>space</b> freeze 4D rotation</div>
      <div><b>1/2/3</b> toggle XW / YW / ZW rotation</div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
